<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廠區接駁車自動驗證系統 / Shuttle Bus Verification System</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    
    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --border-color: #233554;
            --accent-color: #F5A623;
            --text-color: #8892B0;
            --title-color: #FFFFFF;
            --success-color: #2e7d32;
            --error-color: #c62828;
        }

        body {
            font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--accent-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 雙語文字排版樣式 */
        .bi-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .zh { font-size: 16px; color: var(--title-color); font-weight: bold; }
        .en { font-size: 13px; color: var(--text-color); font-weight: normal; }

        h1 {
            text-align: center;
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 .zh { font-size: 24px; }
        h1 .en { font-size: 16px; }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        label {
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #0a192f;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
            margin-top: 6px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        button:hover { opacity: 0.9; }
        .btn-ocr { background-color: #2196F3; color: white; }

        .progress-container { width: 100%; background-color: #233554; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 8px; background-color: var(--accent-color); transition: width 0.3s ease; }

        .result-box { text-align: center; padding: 20px; border-radius: 8px; margin-top: 20px; font-size: 20px; font-weight: bold; display: none; }
        .result-box.pass { background-color: rgba(46, 125, 50, 0.2); border: 2px solid var(--success-color); color: #81c784; }
        .result-box.fail { background-color: rgba(198, 40, 40, 0.2); border: 2px solid var(--error-color); color: #ef9a9a; }
        .detail-info { font-size: 16px; margin-top: 8px; font-weight: normal; }
        .status-badge { font-size: 14px; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }
        .loaded { background-color: var(--success-color); color: #fff; }
        .loading { background-color: #f57c00; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <!-- 標題雙語 -->
    <h1>
        <div class="bi-text">
            <span class="zh">🚌 廠區接駁車自動驗證系統</span>
            <span class="en">Shuttle Bus Automatic Verification System</span>
        </div>
    </h1>

    <!-- 1. 資料庫狀態 -->
    <div class="section">
        <label class="bi-text">
            <span class="zh">1. 後端 Excel 資料庫狀態</span>
            <span class="en">1. Backend Excel Database Status</span>
        </label>
        <div id="fileStatus">
            <span class="status-badge loading">
                <span class="zh">正在自動讀取伺服器內的 test.xlsx...</span><br>
                <span class="en" style="font-size:12px;">Loading test.xlsx from server...</span>
            </span>
        </div>
    </div>

    <!-- 2. 站點選擇 -->
    <div class="section">
        <label for="currentStop" class="bi-text">
            <span class="zh">2. 當前接駁車站點</span>
            <span class="en">2. Current Shuttle Stop</span>
        </label>
        <select id="currentStop">
            <option value="" disabled selected>-- 請選擇站點 / Select Shuttle Stop --</option>
            <option value="SM LIPA">SM LIPA</option>
            <option value="BANAY-BANAY">BANAY-BANAY</option>
            <option value="ROB LIMA">ROB LIMA</option>
            <option value="MALVAR">MALVAR</option>
            <option value="TANAUAN">TANAUAN</option>
            <option value="SAMBAT">SAMBAT</option>
            <option value="SAN PABLO">SAN PABLO</option>
            <option value="STO. TOMAS">STO. TOMAS</option>
            <option value="GARCIA">GARCIA</option>
            <option value="IBAAN/ROSARIO">IBAAN/ROSARIO</option>
            <option value="CALAMBA">CALAMBA</option>
            <option value="BATANGAS">BATANGAS</option>
        </select>
    </div>

    <!-- 3. 驗證與辨識 -->
    <div class="section">
        <label for="scanInput" class="bi-text">
            <span class="zh">3. 驗證與辨識員工 ID</span>
            <span class="en">3. Verify & Identify Employee ID</span>
        </label>
        <input type="text" id="scanInput" placeholder="刷卡、軟體辨識、手動輸入 ID / Swipe, OCR, or Manual ID" autofocus />
        
        <div style="margin-top: 10px;">
            <button onclick="triggerPhotoOCR()" class="btn-ocr">
                <span class="zh">📸 智慧軟體影像識別 ID (OCR)</span><br>
                <span class="en" style="font-size:12px;">Smart Software ID OCR Scan</span>
            </button>
        </div>
        
        <input type="file" id="ocrInputFile" accept="image/*" capture="environment" style="display:none;" onchange="handleOCR(this)" />
        
        <div id="actionStatus" style="text-align: center; margin-top: 12px; font-size: 14px; color: #ffeb3b; font-weight: bold;"></div>
        <div id="progressContainer" class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <!-- 結果顯示區 -->
    <div id="resultBox" class="result-box">
        <div id="resultTitle"></div>
        <div id="resultDetail" class="detail-info"></div>
        <div id="correctStopDisplay" class="detail-info" style="font-weight: bold; color: #ffeb3b; margin-top: 6px;"></div>
    </div>
</div>

<script>
    let excelData = [];

    window.addEventListener('DOMContentLoaded', function() {
        fetch('test.xlsx')
            .then(res => res.arrayBuffer())
            .then(buffer => {
                const workbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                excelData = rawData.map(row => {
                    let cleanRow = {};
                    for (let key in row) {
                        cleanRow[key.trim()] = typeof row[key] === 'string' ? row[key].trim() : row[key];
                    }
                    return cleanRow;
                });
                document.getElementById('fileStatus').innerHTML = `
                    <span class="status-badge loaded">
                        <span class="zh">已成功自動載入伺服器名單，共 ${excelData.length} 筆資料</span><br>
                        <span class="en" style="font-size:12px;">Loaded successfully, total ${excelData.length} records</span>
                    </span>`;
            })
            .catch(err => {
                document.getElementById('fileStatus').innerHTML = `
                    <span class="status-badge" style="background-color:#c62828; color:#fff;">
                        <span class="zh">自動載入失敗</span><br>
                        <span class="en" style="font-size:12px;">Auto-load failed</span>
                    </span>`;
            });
    });

    document.getElementById('scanInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && this.value.trim()) {
            verifyShuttleStop(this.value.trim());
            this.value = '';
        }
    });

    function verifyShuttleStop(scannedId) {
        const currentStop = document.getElementById('currentStop').value;
        const resultBox = document.getElementById('resultBox');
        
        if (!currentStop) { 
            alert("請先選擇當前接駁車站點！\nPlease select current shuttle stop first!"); 
            return; 
        }
        if (excelData.length === 0) { 
            alert("名單尚未載入完成！\nDatabase is still loading!"); 
            return; 
        }

        const matchedUser = excelData.find(item => {
            const idKey = Object.keys(item).find(k => k.toLowerCase().includes('id') || k.includes('工號') || k.includes('員工編號'));
            return idKey && String(item[idKey]).trim().toLowerCase() === String(scannedId).trim().toLowerCase();
        });

        resultBox.style.display = 'block';
        if (!matchedUser) {
            resultBox.className = 'result-box fail';
            document.getElementById('resultTitle').innerHTML = `
                <div>❌ 查無此 ID 記錄</div>
                <div style="font-size:14px; font-weight:normal;">ID Not Found in Database</div>`;
            document.getElementById('resultDetail').innerText = `ID: ${scannedId}`;
            document.getElementById('correctStopDisplay').innerText = '';
            playAudio(false);
            return;
        }

        const stopKey = Object.keys(matchedUser).find(k => k.toLowerCase().includes('shuttle') || k.toLowerCase().includes('stop') || k.includes('站'));
        const userStop = stopKey ? String(matchedUser[stopKey]).trim() : '無紀錄';

        if (userStop.toLowerCase() === currentStop.toLowerCase()) {
            resultBox.className = 'result-box pass';
            document.getElementById('resultTitle').innerHTML = `
                <div>✅ 驗證成功 (MATCH)</div>
                <div style="font-size:14px; font-weight:normal;">Verified Successfully</div>`;
            document.getElementById('resultDetail').innerText = `ID: ${scannedId} (${matchedUser.name || ''})`;
            document.getElementById('correctStopDisplay').innerHTML = `
                <div>📍 正確應搭乘站點：${userStop}</div>
                <div style="font-size:14px; font-weight:normal;">Assigned Stop: ${userStop}</div>`;
            playAudio(true);
        } else {
            resultBox.className = 'result-box fail';
            document.getElementById('resultTitle').innerHTML = `
                <div>⚠️ 站點不符 (MISMATCH)</div>
                <div style="font-size:14px; font-weight:normal;">Shuttle Stop Mismatch</div>`;
            document.getElementById('resultDetail').innerText = `ID: ${scannedId} | 當前 Current: ${currentStop}`;
            document.getElementById('correctStopDisplay').innerHTML = `
                <div>📍 該員工登記的正確站點：${userStop}</div>
                <div style="font-size:14px; font-weight:normal;">Registered Stop: ${userStop}</div>`;
            playAudio(false);
        }
    }

    function triggerPhotoOCR() {
        document.getElementById('ocrInputFile').click();
    }

    function preprocessImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width * 2;
                canvas.height = img.height * 2;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    let val = avg > 140 ? 255 : 0; 
                    data[i]     = val;
                    data[i + 1] = val;
                    data[i + 2] = val;
                }
                ctx.putImageData(imgData, 0, 0);
                canvas.toBlob(blob => callback(blob), 'image/png');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function handleOCR(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const statusDiv = document.getElementById('actionStatus');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            statusDiv.innerHTML = "⏳ 軟體影像處理中... / Processing image...";
            progressContainer.style.display = 'block';
            progressBar.style.width = '20%';

            preprocessImage(file, function(processedBlob) {
                statusDiv.innerHTML = "⏳ 正在辨識證件 ID... / Recognizing ID...";
                progressBar.style.width = '40%';

                Tesseract.recognize(
                    processedBlob,
                    'eng',
                    { 
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const percent = Math.round(m.progress * 100);
                                statusDiv.innerHTML = `⏳ 軟體辨識中... / Recognizing... ${percent}%`;
                                progressBar.style.width = percent + '%';
                            }
                        }
                    }
                ).then(({ data: { text } }) => {
                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        statusDiv.innerText = "";
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                    }, 300);

                    let cleanedText = text.replace(/[^A-Z0-9]/gi, '').toUpperCase();
                    cleanedText = cleanedText.replace(/^I(\d{6})/i, 'C$1');

                    const match = cleanedText.match(/[A-Z]+\d+|\d{3,6}/i);
                    
                    if (match) {
                        const detectedId = match[0].toUpperCase();
                        document.getElementById('scanInput').value = detectedId;
                        verifyShuttleStop(detectedId);
                    } else {
                        alert("未能抓取到 ID，預處理後辨識出的文字為：\nFailed to extract ID. Recognized text:\n" + text);
                    }
                    input.value = '';
                }).catch(err => {
                    statusDiv.innerText = "";
                    progressContainer.style.display = 'none';
                    progressBar.style.width = '0%';
                    alert("辨識失敗 / Recognition failed: " + err);
                    input.value = '';
                });
            });
        }
    }

    function playAudio(isSuccess) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            if (isSuccess) {
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } else {
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        } catch(e) {}
    }
</script>

</body>
</html>
